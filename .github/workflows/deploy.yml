# Publicare automată pe GitHub Pages.
# Fiecare „push” pe ramura main construiește site-ul și îl pune online.
# Activare o singură dată: Repository → Settings → Pages → Source: GitHub Actions.
name: Publicare pe GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite rularea manuală din tab-ul Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
